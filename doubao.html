<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>豆包大模型 API Key 申请教程（动画版）</title>
<style>
:root { --bg:#0b1020; --panel:#121a33; --line:#24305a; --text:#e8ecff; --dim:#8a94c0; --blue:#3b6cff; --cyan:#22d3ee; --ok:#22c55e; --warn:#f59e0b; }
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:'Microsoft YaHei','PingFang SC',sans-serif; background:radial-gradient(1200px 600px at 70% -10%, #1d2b66 0%, var(--bg) 60%); color:var(--text); min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:28px 20px; }
h1 { font-size:26px; letter-spacing:1px; }
h1 span { background:linear-gradient(90deg,var(--cyan),var(--blue)); -webkit-background-clip:text; color:transparent; }
.sub { color:var(--dim); margin:8px 0 22px; font-size:14px; }
.wrap { display:flex; gap:22px; width:min(1180px,100%); }
/* 左侧步骤 */
.steps { width:250px; flex-shrink:0; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px; height:fit-content; }
.step { display:flex; gap:10px; align-items:flex-start; padding:10px; border-radius:10px; cursor:pointer; color:var(--dim); transition:.25s; font-size:14px; line-height:1.4; }
.step .no { width:26px; height:26px; border-radius:50%; border:2px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:13px; flex-shrink:0; transition:.25s; }
.step.active { background:rgba(59,108,255,.15); color:var(--text); }
.step.active .no { border-color:var(--blue); background:var(--blue); color:#fff; box-shadow:0 0 14px var(--blue); }
.step.done .no { border-color:var(--ok); background:var(--ok); color:#fff; }
.step.done { color:#b7c0e6; }
/* 右侧浏览器 */
.stage { flex:1; min-width:0; }
.browser { background:#f5f7fb; border-radius:14px; overflow:hidden; box-shadow:0 20px 60px rgba(0,0,0,.45); border:1px solid #2b376b; position:relative; }
.bar { background:#e3e7f0; padding:10px 14px; display:flex; align-items:center; gap:10px; }
.dots i { display:inline-block; width:11px; height:11px; border-radius:50%; margin-right:6px; }
.dots i:nth-child(1){background:#ff5f57}.dots i:nth-child(2){background:#febc2e}.dots i:nth-child(3){background:#28c840}
.url { flex:1; background:#fff; border-radius:8px; padding:6px 12px; font-size:13px; color:#3a4466; font-family:Consolas,monospace; white-space:nowrap; overflow:hidden; }
.url b { color:#16a34a; font-weight:normal; }
.page { height:470px; position:relative; color:#1e2340; overflow:hidden; }
.page > .scene { position:absolute; inset:0; animation:fadeIn .45s ease; }
@keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
/* 鼠标与点击效果 */
#cursor { position:absolute; left:50%; top:60%; width:22px; height:22px; z-index:50; pointer-events:none; transition:left .9s cubic-bezier(.6,.05,.3,1), top .9s cubic-bezier(.6,.05,.3,1); filter:drop-shadow(0 2px 3px rgba(0,0,0,.35)); }
.ripple { position:absolute; width:14px; height:14px; border-radius:50%; border:3px solid var(--blue); z-index:49; pointer-events:none; animation:rip .6s ease-out forwards; }
@keyframes rip { from { transform:translate(-50%,-50%) scale(.4); opacity:1; } to { transform:translate(-50%,-50%) scale(3.2); opacity:0; } }
.pressed { transform:scale(.94); filter:brightness(.92); }
.glow { box-shadow:0 0 0 3px rgba(59,108,255,.55), 0 0 22px rgba(59,108,255,.6) !important; transition:box-shadow .3s; }
/* 讲解字幕 + 控制 */
.caption { margin-top:16px; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px 18px; min-height:74px; font-size:15px; line-height:1.7; }
.caption .tag { display:inline-block; background:var(--blue); color:#fff; border-radius:6px; padding:0 8px; font-size:12px; margin-right:8px; }
.caption code { background:#0b1230; color:var(--cyan); padding:1px 6px; border-radius:5px; font-family:Consolas,monospace; font-size:13px; }
.ctrl { margin-top:14px; display:flex; gap:10px; align-items:center; }
.ctrl button { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:9px; padding:8px 16px; cursor:pointer; font-size:14px; font-family:inherit; }
.ctrl button:hover { border-color:var(--blue); }
.ctrl button.pri { background:var(--blue); border-color:var(--blue); }
.prog { flex:1; height:6px; background:var(--line); border-radius:3px; overflow:hidden; }
.prog i { display:block; height:100%; width:0; background:linear-gradient(90deg,var(--cyan),var(--blue)); transition:width .5s; }
.tips { width:min(1180px,100%); margin-top:22px; display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
.tip { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px 16px; font-size:13px; line-height:1.7; color:#c3cbef; }
.tip b { color:var(--warn); display:block; margin-bottom:4px; font-size:14px; }
/* 模拟网页里的通用元素 */
.top { height:54px; background:#fff; border-bottom:1px solid #e6e9f2; display:flex; align-items:center; padding:0 22px; gap:22px; font-size:14px; color:#4b5578; }
.logo { font-weight:bold; color:#1f3fd6; font-size:17px; display:flex; align-items:center; gap:6px; }
.logo i { width:20px; height:20px; border-radius:5px; background:linear-gradient(135deg,#3b6cff,#22d3ee); display:inline-block; }
.btn { display:inline-block; background:#1f5eff; color:#fff; border-radius:7px; padding:8px 18px; font-size:14px; transition:.15s; }
.btn.ghost { background:#fff; color:#1f5eff; border:1px solid #1f5eff; }
.input { border:1px solid #cfd5e6; border-radius:7px; padding:10px 12px; font-size:14px; background:#fff; min-height:40px; color:#1e2340; font-family:Consolas,'Microsoft YaHei',monospace; }
.input:empty::before { content:attr(data-ph); color:#a0a8c4; }
.side { position:absolute; left:0; top:54px; bottom:0; width:190px; background:#fff; border-right:1px solid #e6e9f2; padding:12px 8px; font-size:13px; }
.side div { padding:9px 12px; border-radius:6px; color:#4b5578; }
.side div.on { background:#eef2ff; color:#1f5eff; font-weight:bold; }
.side .grp { color:#9aa3c2; font-size:12px; padding:12px 12px 4px; }
.main { position:absolute; left:190px; right:0; top:54px; bottom:0; padding:22px 26px; background:#f6f8fc; }
.card { background:#fff; border:1px solid #e6e9f2; border-radius:10px; padding:16px 18px; }
.row { display:flex; align-items:center; justify-content:space-between; padding:12px 4px; border-bottom:1px solid #eef0f6; font-size:14px; }
.badge { font-size:12px; border-radius:5px; padding:2px 8px; background:#ecfdf3; color:#16a34a; }
.badge.off { background:#f1f3f9; color:#8a93b2; }
.modal { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:440px; background:#fff; border-radius:12px; box-shadow:0 16px 50px rgba(20,30,80,.25); padding:22px; z-index:10; animation:fadeIn .35s; }
.mask { position:absolute; inset:0; background:rgba(15,20,45,.35); z-index:9; animation:fadeIn .3s; }
.toast { position:absolute; left:50%; top:70px; transform:translateX(-50%); background:#16a34a; color:#fff; padding:8px 18px; border-radius:8px; font-size:14px; z-index:20; animation:fadeIn .3s; }
</style>
</head>

];

// ===== 页面里的小动作 =====
function toast(msg){ const p=document.querySelector('#page'); const t=document.createElement('div'); t.className='toast'; t.textContent=msg; p.appendChild(t); setTimeout(()=>t.remove(),1600); }
function openModel(i){ const b=document.querySelector('#bd'+i); b.className='badge'; b.textContent='已开通'; const o=document.querySelector('#op'+i); o.className='btn ghost'; o.textContent='已开通'; toast(`✅ ${MODELS[i][0]} 开通成功`); }
function showKeyModal(){ const p=document.querySelector('#page'); p.insertAdjacentHTML('beforeend',`<div class="mask" id="mask"></div><div class="modal" id="modal"><div style="font-size:17px;font-weight:bold;margin-bottom:14px">创建 API Key</div><div class="input" id="kname" data-ph="API Key 名称"></div><div style="text-align:right;margin-top:18px"><span class="btn ghost">取消</span>　<span class="btn" id="kok">创建</span></div></div>`); }
function keyCreated(){ document.querySelector('#mask').remove(); document.querySelector('#modal').remove();
  document.querySelector('#list').innerHTML=`<div class="row"><div><b>智能解说</b><div style="color:#7a84a8;font-size:12px;margin-top:3px;font-family:Consolas">ark-3f7a••••••••••••••••••••c91e</div></div><div><span class="badge">启用</span>　<span class="btn ghost" id="copy" style="padding:6px 14px">📋 复制</span></div></div>`; toast('✅ 创建成功'); }

// ===== 播放引擎 =====
const page=document.querySelector('#page'), cursor=document.querySelector('#cursor'), cap=document.querySelector('#caption'), urlEl=document.querySelector('#url'), stepsEl=document.querySelector('#steps'), bar=document.querySelector('#bar');
let cur=0, paused=false, token=0;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function waitPlay(tk){ while(paused){ await sleep(100); if(tk!==token) throw 0; } if(tk!==token) throw 0; }
function center(el){ const b=document.querySelector('.browser').getBoundingClientRect(), r=el.getBoundingClientRect(); return [r.left-b.left+r.width/2, r.top-b.top+r.height/2]; }
async function moveTo(el,tk){ const [x,y]=center(el); cursor.style.left=(x-4)+'px'; cursor.style.top=(y-2)+'px'; await sleep(950); await waitPlay(tk); }
async function click(el,tk){ el.classList.add('glow'); await moveTo(el,tk); const [x,y]=center(el); const r=document.createElement('div'); r.className='ripple'; r.style.left=x+'px'; r.style.top=y+'px'; document.querySelector('.browser').appendChild(r); setTimeout(()=>r.remove(),650);
  el.classList.add('pressed'); await sleep(180); el.classList.remove('pressed','glow'); await sleep(250); }
async function type(el,text,fast,tk){ await click(el,tk); el.textContent=''; for(const ch of text){ el.textContent+=ch; await sleep(fast?18:70); await waitPlay(tk); } await sleep(300); }
function renderSteps(){ stepsEl.innerHTML=SCENES.map((s,i)=>`<div class="step ${i===cur?'active':i<cur?'done':''}" data-i="${i}"><div class="no">${i<cur?'✓':i+1}</div><div>${s.title}</div></div>`).join(''); stepsEl.querySelectorAll('.step').forEach(e=>e.onclick=()=>go(+e.dataset.i)); bar.style.width=((cur+1)/SCENES.length*100)+'%'; }
async function runScene(i){ const tk=++token; cur=i; renderSteps(); const s=SCENES[i]; urlEl.innerHTML=s.url; page.innerHTML=`<div class="scene">${s.html}</div>`;
  cap.innerHTML=`<span class="tag">第 ${i+1}/${SCENES.length} 步</span>`; cursor.style.left='60%'; cursor.style.top='75%';
  try { await sleep(500); await waitPlay(tk);
    for(const a of s.acts){
      if(a.s) cap.innerHTML=`<span class="tag">第 ${i+1}/${SCENES.length} 步</span>${a.s}`;
      if(a.w) await sleep(a.w);
      if(a.t) await type(document.querySelector(a.t),a.v,a.fast,tk);
      if(a.c) await click(document.querySelector(a.c),tk);
      if(a.f) a.f();
      await waitPlay(tk);
    }
    await sleep(2200); await waitPlay(tk);
    if(i<SCENES.length-1) runScene(i+1); else { renderSteps(); stepsEl.querySelectorAll('.step').forEach(e=>e.classList.add('done')); }
  } catch(e) { /* 被跳转打断 */ } }
function go(i){ paused=false; document.querySelector('#play').textContent='⏸ 暂停'; runScene(Math.max(0,Math.min(SCENES.length-1,i))); }
document.querySelector('#prev').onclick=()=>go(cur-1);
document.querySelector('#next').onclick=()=>go(cur+1);
document.querySelector('#replay').onclick=()=>go(cur);
document.querySelector('#play').onclick=e=>{ paused=!paused; e.target.textContent=paused?'▶ 继续':'⏸ 暂停'; };
runScene(0);
</script>
</body>
</html>
