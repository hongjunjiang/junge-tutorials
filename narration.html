<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>智能解说 · 动画教程</title>
<style>
:root { --bg:#0b1020; --panel:#121a33; --line:#24305a; --text:#e8ecff; --dim:#8a94c0; --blue:#3b6cff; --cyan:#22d3ee; --ok:#22c55e; --warn:#f59e0b; --jy:#14161c; --jy2:#1d2029; --jyline:#2c303b; }
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:'Microsoft YaHei','PingFang SC',sans-serif; background:radial-gradient(1200px 600px at 70% -10%, #1d2b66 0%, var(--bg) 60%); color:var(--text); min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:28px 20px; }
h1 { font-size:26px; letter-spacing:1px; } h1 span { background:linear-gradient(90deg,var(--cyan),var(--blue)); -webkit-background-clip:text; color:transparent; }
.sub { color:var(--dim); margin:8px 0 22px; font-size:14px; }
.wrap { display:flex; gap:22px; width:min(1200px,100%); }
.steps { width:260px; flex-shrink:0; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px; height:fit-content; }
.grpT { font-size:12px; color:var(--warn); padding:8px 10px 4px; letter-spacing:1px; }
.step { display:flex; gap:10px; align-items:flex-start; padding:9px 10px; border-radius:10px; cursor:pointer; color:var(--dim); transition:.25s; font-size:14px; line-height:1.4; }
.step .no { width:26px; height:26px; border-radius:50%; border:2px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:13px; flex-shrink:0; transition:.25s; }
.step.active { background:rgba(59,108,255,.15); color:var(--text); }
.step.active .no { border-color:var(--blue); background:var(--blue); color:#fff; box-shadow:0 0 14px var(--blue); }
.step.done .no { border-color:var(--ok); background:var(--ok); color:#fff; } .step.done { color:#b7c0e6; }
.stage { flex:1; min-width:0; }
.win { border-radius:14px; overflow:hidden; box-shadow:0 20px 60px rgba(0,0,0,.45); border:1px solid #2b376b; position:relative; background:#0d1117; }
.bar { background:#1b1f27; padding:9px 14px; display:flex; align-items:center; gap:10px; color:#9aa3b8; font-size:13px; }
.dots i { display:inline-block; width:11px; height:11px; border-radius:50%; margin-right:6px; }
.dots i:nth-child(1){background:#ff5f57}.dots i:nth-child(2){background:#febc2e}.dots i:nth-child(3){background:#28c840}
.page { height:490px; position:relative; overflow:hidden; font-size:13px; }
.page > .scene { position:absolute; inset:0; animation:fadeIn .45s ease; }
@keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
#cursor { position:absolute; left:60%; top:75%; width:22px; height:22px; z-index:50; pointer-events:none; transition:left .9s cubic-bezier(.6,.05,.3,1), top .9s cubic-bezier(.6,.05,.3,1); filter:drop-shadow(0 2px 3px rgba(0,0,0,.5)); }
.ripple { position:absolute; width:14px; height:14px; border-radius:50%; border:3px solid var(--cyan); z-index:49; pointer-events:none; animation:rip .6s ease-out forwards; }
@keyframes rip { from { transform:translate(-50%,-50%) scale(.4); opacity:1; } to { transform:translate(-50%,-50%) scale(3.2); opacity:0; } }
.pressed { transform:scale(.94); filter:brightness(.9); } .glow { box-shadow:0 0 0 2px rgba(34,211,238,.7), 0 0 20px rgba(34,211,238,.6) !important; }
.caption { margin-top:16px; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px 18px; min-height:78px; font-size:15px; line-height:1.7; }
.caption .tag { display:inline-block; background:var(--blue); color:#fff; border-radius:6px; padding:0 8px; font-size:12px; margin-right:8px; }
.caption code { background:#0b1230; color:var(--cyan); padding:1px 6px; border-radius:5px; font-family:Consolas,monospace; font-size:13px; }
.caption .warn { color:var(--warn); }
.ctrl { margin-top:14px; display:flex; gap:10px; align-items:center; }
.ctrl button { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:9px; padding:8px 16px; cursor:pointer; font-size:14px; font-family:inherit; }
.ctrl button:hover { border-color:var(--blue); } .ctrl button.pri { background:var(--blue); border-color:var(--blue); }
.prog { flex:1; height:6px; background:var(--line); border-radius:3px; overflow:hidden; } .prog i { display:block; height:100%; width:0; background:linear-gradient(90deg,var(--cyan),var(--blue)); transition:width .5s; }
.tips { width:min(1200px,100%); margin-top:22px; display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
.tip { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px 16px; font-size:13px; line-height:1.7; color:#c3cbef; } .tip b { color:var(--warn); display:block; margin-bottom:4px; font-size:14px; }
/* ---- 剪映模拟 ---- */
.jy { position:absolute; inset:0; background:var(--jy); color:#d6d9e0; }
.jyTop { height:38px; background:var(--jy2); border-bottom:1px solid var(--jyline); display:flex; align-items:center; gap:4px; padding:0 10px; }
.jyTab { padding:6px 12px; border-radius:6px; color:#aab0bd; } .jyTab.on { background:#2a2e39; color:#fff; }
.jyLib { position:absolute; left:0; top:38px; width:260px; height:230px; border-right:1px solid var(--jyline); padding:12px; }
.thumb { width:110px; height:64px; border-radius:6px; background:linear-gradient(135deg,#3b2f5c,#1f4b6e); position:relative; display:inline-block; }
.thumb span { position:absolute; left:6px; bottom:4px; font-size:11px; color:#fff; }
.jyPrev { position:absolute; left:260px; right:0; top:38px; height:230px; display:flex; align-items:center; justify-content:center; }
.screen { width:300px; height:170px; background:linear-gradient(160deg,#2c3a55,#0f1420); border-radius:4px; position:relative; display:flex; align-items:flex-end; justify-content:center; padding-bottom:10px; color:#fff; font-size:14px; }
.jyTool { position:absolute; left:0; right:0; top:268px; height:34px; background:var(--jy2); border-top:1px solid var(--jyline); border-bottom:1px solid var(--jyline); display:flex; align-items:center; gap:14px; padding:0 14px; color:#aab0bd; }
.jyTool span { padding:4px 8px; border-radius:5px; } 
.tl { position:absolute; left:0; right:0; top:302px; bottom:0; padding:14px 14px 0 70px; }
.tlLabel { position:absolute; left:12px; font-size:11px; color:#7c8394; }
.track { height:30px; border-radius:4px; margin-bottom:10px; display:flex; overflow:hidden; }
.track.v { background:#24506b; } .track.sub { height:20px; } .track.au { height:22px; }
.seg { height:100%; border-right:2px solid var(--jy); background:linear-gradient(180deg,#2e6e8e,#1e4f68); animation:fadeIn .25s; }
.sbox { height:100%; background:#8a5cf6; border-right:2px solid var(--jy); border-radius:3px; animation:fadeIn .25s; }
.menu { position:absolute; background:#2a2e39; border:1px solid #3a3f4c; border-radius:8px; padding:6px; z-index:8; box-shadow:0 8px 24px rgba(0,0,0,.5); animation:fadeIn .2s; }
.menu div { padding:7px 14px; border-radius:5px; color:#d6d9e0; } 
.jyBtn { background:#00c8d6; color:#062; color:#05252a; border-radius:6px; padding:7px 16px; font-weight:bold; display:inline-block; }
/* ---- 软件模拟 ---- */
.app { position:absolute; inset:0; background:#0a0e14; color:#e6edf3; display:flex; }
.appSide { width:150px; background:#0d1117; border-right:1px solid #30363d; padding:10px 0; flex-shrink:0; }
.appSide div { padding:9px 16px; color:#c9d1d9; font-size:13px; border-left:3px solid transparent; }
.appSide div.on { background:linear-gradient(90deg,rgba(31,111,235,.2),transparent); border-left-color:#1f6feb; color:#58a6ff; }
.appMain { flex:1; padding:14px 20px; overflow:hidden; }
.sec { font-weight:bold; margin:4px 0 10px; font-size:14px; }
.fld { background:#21262d; border:1px solid #30363d; border-radius:6px; padding:7px 10px; color:#e6edf3; min-height:32px; font-size:13px; }
.fld:empty::before { content:attr(data-ph); color:#6e7681; }
.abtn { display:inline-block; background:#21262d; border:1px solid #30363d; color:#e6edf3; border-radius:6px; padding:6px 14px; } .abtn.pri { background:#1f6feb; border-color:#1f6feb; color:#fff; font-weight:bold; }
.dcard { display:inline-block; width:118px; background:#161b22; border:2px solid #30363d; border-radius:6px; padding:8px; margin-right:8px; text-align:center; } .dcard.sel { border-color:#1f6feb; background:rgba(31,111,235,.15); }
.sel { } .opt { display:inline-block; background:#21262d; border:1px solid #30363d; border-radius:6px; padding:6px 10px; margin-right:6px; }
.opt.on { border-color:#1f6feb; background:rgba(31,111,235,.18); color:#fff; }
.log { background:#161b22; border:1px solid #30363d; border-radius:6px; height:220px; padding:10px 12px; font-family:Consolas,'Microsoft YaHei',monospace; font-size:12px; line-height:1.7; color:#9da7b3; overflow:hidden; }
.log .ok { color:#3fb950; }
.pbar { height:16px; background:#21262d; border-radius:8px; overflow:hidden; border:1px solid #30363d; margin:10px 0; } .pbar i { display:block; height:100%; width:0; background:#1f6feb; transition:width .6s; }
.toast { position:absolute; left:50%; top:54px; transform:translateX(-50%); background:#16a34a; color:#fff; padding:8px 18px; border-radius:8px; font-size:14px; z-index:20; animation:fadeIn .3s; }
</style>
</head>
<body>
<a href="index.html" style="position:fixed;left:18px;top:14px;color:#8a94c0;font-size:13px;text-decoration:none;border:1px solid #24305a;border-radius:8px;padding:5px 12px;background:#121a33;z-index:99">← 教程首页</a>
<h1>🎙️ <span>智能解说</span> 动画教程</h1>
<div class="sub">原片 → 剪映准备 → 软件一键生成 → 剪映草稿　｜　传统解说 + 弹幕解说　｜　自动播放，点左侧步骤可跳转</div>
<div class="wrap">
  <div class="steps" id="steps"></div>
  <div class="stage">
    <div class="win">
      <div class="bar"><div class="dots"><i></i><i></i><i></i></div><span id="wtitle"></span></div>
      <div class="page" id="page"></div>
      <svg id="cursor" viewBox="0 0 24 24"><path d="M3 2l7 19 2.6-7.4L20 11z" fill="#fff" stroke="#111" stroke-width="1.6" stroke-linejoin="round"/></svg>
    </div>
    <div class="caption" id="caption"></div>
    <div class="ctrl"><button id="prev">⏮ 上一步</button><button id="play" class="pri">⏸ 暂停</button><button id="next">下一步 ⏭</button><button id="replay">🔁 重播本步</button><div class="prog"><i id="bar"></i></div></div>
  </div>
</div>
<div class="tips">
  <div class="tip"><b>📱 短剧</b>剪映里<b>先识别字幕，再智能分割</b>（顺序反了字幕会断断续续），场景草稿里有字幕轨，SRT 留空。</div>
  <div class="tip"><b>🎞️ 影视剧</b>剪映里只做「智能分割」，台词用<b>中文 SRT</b>（和视频同一版本）。不给台词质量差很多，也不能截原声。</div>
  <div class="tip"><b>💰 省钱</b>同一部片子 + 同一个场景草稿，打过一次标就有缓存，再跑只花写文案的钱。</div>
  <div class="tip"><b>⚠️ 常见坑</b>别选 0 字节的空 SRT（会覆盖草稿字幕，原声被关掉）；识别字幕要做在<b>同一个</b>场景草稿上。</div>
</div>
<script>
// ===== 共用模板 =====
const JY = (inner, tool) => `<div class="jy">
  <div class="jyTop"><span class="jyTab on" id="tMedia">媒体</span><span class="jyTab">音频</span><span class="jyTab" id="tText">文本</span><span class="jyTab">贴纸</span><span class="jyTab">特效</span><span class="jyTab">转场</span><span style="margin-left:auto;color:#7c8394">剪映专业版</span></div>
  <div class="jyLib" id="lib">${inner || '<div class="thumb" id="clip"><span>合并视频.mp4</span></div>'}</div>
  <div class="jyPrev"><div class="screen" id="screen">原片预览</div></div>
  <div class="jyTool">${tool || '<span>↶</span><span>↷</span><span>✂ 分割</span><span>🗑</span>'}</div>
  <div class="tl"><div class="tlLabel" style="top:16px" id="subL"></div><div class="track sub" id="st"></div>
    <div class="tlLabel" style="top:50px">视频</div><div class="track v" id="vt" style="width:0"></div></div></div>`;
// 字幕轨：识别字幕后出现在视频轨上方（固定随机种子，重播一致）
const SUBS = Array.from({ length: 31 }, (_, i) => [1.5 + ((i * 37) % 30) / 10, ((i * 53) % 15) / 10]);
const subBoxes = () => SUBS.map(([w, m]) => `<div class="sbox" style="width:${w.toFixed(1)}%;flex:none;margin-right:${m.toFixed(1)}%"></div>`).join('');
const SIDE = `<div class="appSide"><div>🎯 智能匹配</div><div>✂️ 文案粗剪</div><div class="on" id="navEfb">🎙️ 智能解说</div><div>⚡ 智能快剪</div><div>🧹 去重</div><div>⚙️ 软件设置</div></div>`;
const segs = (n, w) => Array.from({ length: n }, () => `<div class="seg" style="width:${(w / n).toFixed(2)}%;flex:none"></div>`).join('');

const SCENES = [
// ---------- 第一部分：剪映 ----------
{ grp:'第一部分 · 剪映里准备', title:'导入原片，拖到时间线', win:'剪映专业版 · 新建草稿',
  html: JY(),
  acts:[{s:'打开剪映专业版，<b>新建一个草稿</b>，导入要解说的原片（短剧合集、单集、整部电影都行），拖到时间线上。'},
        {c:'#clip',f:()=>{const v=document.querySelector('#vt'); v.style.transition='width .8s'; v.style.width='100%'; document.querySelector('#screen').textContent='▶ 原片';}},{w:1000}] },

{ title:'先识别字幕（短剧必做）', win:'剪映专业版 · 文本 → 智能字幕',
  html: JY(`<div style="color:#aab0bd;margin-bottom:8px">智能字幕</div><div style="background:#1d2029;border:1px solid #2c303b;border-radius:8px;padding:12px"><b>识别字幕</b><div style="color:#7c8394;font-size:12px;margin:6px 0 10px">识别视频里的人声，自动生成字幕</div><span class="jyBtn" id="recog">开始识别</span></div>`),
  acts:[{f:()=>{document.querySelector('#vt').style.width='100%';}},
        {s:'原片拖进时间线后，<b>先识别字幕</b>：点顶部 <b>文本 → 智能字幕 → 识别字幕 → 开始识别</b>。<span class="warn">一定要在智能分割之前做，先分割再识别，字幕会断断续续。</span>'},
        {c:'#tText'},{c:'#recog',f:()=>{document.querySelector('#subL').textContent='字幕'; const s=document.querySelector('#st'); let k=0; const t=setInterval(()=>{ if(!document.body.contains(s)) return clearInterval(t); s.insertAdjacentHTML('beforeend',`<div class="sbox" style="width:${SUBS[k][0].toFixed(1)}%;flex:none;margin-right:${SUBS[k][1].toFixed(1)}%"></div>`); if(++k>=SUBS.length) clearInterval(t); },55); document.querySelector('#screen').textContent='「你凭什么赶我走！」';}},{w:2400},
        {s:'识别完，时间线上 <b>字幕轨在上、视频在下</b>。软件会用这些台词：打标认人名、写文案、精确截原声。<span class="warn">影视剧可以不识别，改用中文 SRT 文件。</span>'},{w:2200}] },

{ title:'再智能分割：把原片切成一个个镜头', win:'剪映专业版 · 草稿「重生八零」',
  html: JY(null, '<span>↶</span><span>↷</span><span>✂ 分割</span><span>🗑</span><span id="smart" style="background:#2a2e39;color:#00c8d6">🪄 智能分割</span>'),
  acts:[{f:()=>{document.querySelector('#vt').style.width='100%'; document.querySelector('#subL').textContent='字幕'; document.querySelector('#st').innerHTML=subBoxes();}},
        {s:'字幕出来后，选中下面的 <b>视频轨</b>，再用剪映的 <b>智能分割</b>（按镜头自动切开）。软件靠这些切点认识每个镜头：切得越准，画面配得越准。<span class="warn">（按钮位置以你的剪映版本为准）</span>'},
        {c:'#vt'},{c:'#smart',f:()=>{const v=document.querySelector('#vt'); v.innerHTML=''; let k=0; const t=setInterval(()=>{ if(!document.body.contains(v)) return clearInterval(t); v.insertAdjacentHTML('beforeend',`<div class="seg" style="width:${(2+((k*29)%40)/10).toFixed(1)}%;flex:none"></div>`); if(++k>26) clearInterval(t); },60);}},{w:2200},
        {s:'分割完不用导出，<b>关掉剪映就行</b>（草稿自动保存）。这个草稿就是软件里要选的「场景草稿」。'},{w:1600}] },

// ---------- 第二部分：软件 ----------
{ grp:'第二部分 · 软件里生成', title:'选原片 + 场景草稿', win:'军哥团队智能匹配软件',
  html:`<div class="app">${SIDE}<div class="appMain">
    <div class="sec">① 原片视频</div><div style="display:flex;gap:8px"><div class="fld" id="vpath" style="flex:1" data-ph="选择要解说的原片视频..."></div><span class="abtn" id="pick">📂 选择</span></div>
    <div class="sec" style="margin-top:16px">场景草稿（剪映里做过智能分割的草稿）</div>
    <div><span class="dcard"><b>10月7日</b><div style="color:#7d8590;font-size:11px">29 段</div></span><span class="dcard" id="d1"><b>11月9日 (4)</b><div style="color:#7d8590;font-size:11px">439 段 · 有字幕</div></span><span class="dcard"><b>11月11日 (2)</b><div style="color:#7d8590;font-size:11px">439 段 · 无字幕</div></span></div>
  </div></div>`,
  acts:[{s:'回到软件，左侧点 <b>🎙️ 智能解说</b>。在 <b>① 原片视频</b> 点「选择」，选同一个原片文件；再在下面的草稿列表里点刚才的场景草稿。'},
        {c:'#navEfb'},{c:'#pick',f:()=>{document.querySelector('#vpath').textContent='F:\\真人影游\\重生八零赶海发家养妻女\\合并视频.mp4';}},{w:400},
        {s:'选 <b>有字幕</b> 的那个草稿。<span class="warn">同一部片子做过好几个草稿时别选错：没识别字幕的草稿拿不到台词，原声会被自动关掉。</span>'},
        {c:'#d1',f:()=>{document.querySelector('#d1').classList.add('sel');}},{w:1200}] },

{ title:'解说设置', win:'军哥团队智能匹配软件 · ② 解说设置',
  html:`<div class="app">${SIDE}<div class="appMain">
    <div class="sec">② 解说设置</div>
    <div style="margin-bottom:10px"><span style="color:#7d8590;display:inline-block;width:78px">解说方式</span><span class="opt on" id="o1">🎙️ 传统解说</span><span class="opt" id="o1b">💬 弹幕解说</span></div>
    <div style="margin-bottom:10px"><span style="color:#7d8590;display:inline-block;width:78px">内容类型</span><span class="opt on" id="o2">📱 短剧</span><span class="opt">🎞️ 影视剧</span></div>
    <div style="margin-bottom:10px"><span style="color:#7d8590;display:inline-block;width:78px">写作风格</span><span class="opt on" id="o3">🎯 自动</span><span class="opt">⚡ 短剧爽文</span><span class="opt">🕵️ 悬疑</span><span class="opt">😏 吐槽</span></div>
    <div style="margin-bottom:10px"><span style="color:#7d8590;display:inline-block;width:78px">原声对白</span><span class="opt on" id="o4">🔊 多（8~12 处）</span><span class="opt">🔉 少</span><span class="opt">🔇 不保留</span></div>
    <div style="margin-bottom:10px"><span style="color:#7d8590;display:inline-block;width:78px">解说字数</span><span class="opt">短 1500</span><span class="opt on" id="o5">中 2500</span><span class="opt">长 3500</span><span style="color:#7d8590;margin-left:6px">约 9 分钟成片</span></div>
    <div style="margin-bottom:10px"><span style="color:#7d8590;display:inline-block;width:78px">台词 SRT</span><span class="fld" style="display:inline-block;width:300px" data-ph="短剧留空；影视剧选中文 SRT"></span></div>

function toast(msg){ const p=document.querySelector('#page'); const t=document.createElement('div'); t.className='toast'; t.textContent=msg; p.appendChild(t); setTimeout(()=>t.remove(),1600); }
function runLog(){
  const L=['[智能解说] 原片 52.3 分钟，1080x1920','[步骤1] 场景 439 个；台词来源：场景草稿里的字幕轨，920 句','[打标] 本次把字幕台词一起交给打标模型，用来认出画面里的人物','[打标] 开始打标：11 段，模型 doubao-seed-2-1-lite','[打标] 完成：431/431 个场景有描述','[步骤3] 场景剧本已生成（32560 字）','[步骤4] 写解说：目标 9 分钟，解说 2500~2875 字，原声 ≤67s','[步骤4] 完成：解说 186 句 / 2731 字，原声 10 处','[步骤5] 配音... [配音] 186/186','[步骤6] 模糊原片硬字幕','[步骤7] 生成剪映草稿...','<span class="ok">✅ 智能解说完成：智能解说_11月11日_1745，成片 538.4s</span>'];
  const log=document.querySelector('#log'), pb=document.querySelector('#pb'); let i=0;
  const t=setInterval(()=>{ if(!document.body.contains(log)) return clearInterval(t); log.insertAdjacentHTML('beforeend',L[i]+'<br>'); pb.style.width=((i+1)/L.length*100)+'%'; if(++i>=L.length) clearInterval(t); },520);
}
function buildResult(){
  const r1=document.querySelector('#r1'), r2=document.querySelector('#r2'), r3=document.querySelector('#r3'), r4=document.querySelector('#r4');
  let x=0; while(x<96){ const w=2+Math.random()*3, gap=Math.random()<0.15; if(gap){ r4.insertAdjacentHTML('beforeend',`<div style="width:${w*2}%;margin-left:${x-(r4.dataset.x||0)}%;background:#f59e0b;border-radius:3px;flex:none"></div>`); r4.dataset.x=x+w*2;
      r2.insertAdjacentHTML('beforeend',`<div class="seg" style="width:${w*2}%;flex:none;background:linear-gradient(180deg,#b45309,#78350f)"></div>`); r1.insertAdjacentHTML('beforeend',`<div class="sbox" style="width:${w*2}%;flex:none;background:#a16207"></div>`); r3.insertAdjacentHTML('beforeend',`<div style="width:${w*2}%;flex:none"></div>`); x+=w*2; }
    else { r2.insertAdjacentHTML('beforeend',`<div class="seg" style="width:${w}%;flex:none"></div>`); r1.insertAdjacentHTML('beforeend',`<div class="sbox" style="width:${w}%;flex:none"></div>`); r3.insertAdjacentHTML('beforeend',`<div style="width:${w}%;flex:none;background:#16a34a;border-right:2px solid #14161c;border-radius:3px"></div>`); x+=w; } }
  const lines=['「谁能想到，被赶出门的她」','「三年后带着亿万身家回来了」','🔊 原声：「你凭什么赶我走！」','「这一巴掌，打醒了所有人」']; let k=0;

}

function buildDm(){
  const q1=document.querySelector('#q1'), q2=document.querySelector('#q2'), q3=document.querySelector('#q3');
  const cols=['#2e6e8e','#7c3aed','#b45309','#0f766e','#be123c']; let x=0;
  while(x<96){ const w=4+Math.random()*5; q3.insertAdjacentHTML('beforeend',`<div class="seg" style="width:${w.toFixed(1)}%;flex:none;background:${cols[Math.floor(Math.random()*cols.length)]}"></div>`);
    q1.insertAdjacentHTML('beforeend',`<div style="width:${(w*0.45).toFixed(1)}%;flex:none;background:#eab308;border-radius:3px;margin-right:${(w*0.55).toFixed(1)}%"></div>`);
    q2.insertAdjacentHTML('beforeend',`<div class="sbox" style="width:${(w*0.4).toFixed(1)}%;flex:none;margin-right:${(w*0.1).toFixed(1)}%"></div><div class="sbox" style="width:${(w*0.4).toFixed(1)}%;flex:none;margin-right:${(w*0.1).toFixed(1)}%"></div>`); x+=w; }
  const P=[['“三年后她开着豪车回村”','你们当初是怎么对我的？'],['“当年她被全家赶出门”','滚！别再回来！'],['“只因为生的是女儿”','一个丫头片子有什么用'],['“她靠赶海一点点翻身”','今天又是满满一桶'],['“前夫一家找上门了”','你凭什么赶我走！'],['“这一巴掌打醒了所有人”','……']];
  let k=0; const show=()=>{ const c=document.querySelector('#dcap'), s=document.querySelector('#dsub'); if(!c) return false; c.textContent=P[k%P.length][0]; s.textContent=P[k%P.length][1]; k++; return true; };
  show(); const t=setInterval(()=>{ if(!show()) clearInterval(t); },1500);
}

const page=document.querySelector('#page'), cursor=document.querySelector('#cursor'), cap=document.querySelector('#caption'), wt=document.querySelector('#wtitle'), stepsEl=document.querySelector('#steps'), bar=document.querySelector('#bar');
let cur=0, paused=false, token=0;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function waitPlay(tk){ while(paused){ await sleep(100); if(tk!==token) throw 0; } if(tk!==token) throw 0; }
function center(el){ const b=document.querySelector('.win').getBoundingClientRect(), r=el.getBoundingClientRect(); return [r.left-b.left+r.width/2, r.top-b.top+r.height/2]; }
async function moveTo(el,tk){ const [x,y]=center(el); cursor.style.left=(x-4)+'px'; cursor.style.top=(y-2)+'px'; await sleep(950); await waitPlay(tk); }
async function click(el,tk){ el.classList.add('glow'); await moveTo(el,tk); const [x,y]=center(el); const r=document.createElement('div'); r.className='ripple'; r.style.left=x+'px'; r.style.top=y+'px'; document.querySelector('.win').appendChild(r); setTimeout(()=>r.remove(),650);
  el.classList.add('pressed'); await sleep(180); el.classList.remove('pressed','glow'); await sleep(250); }
function renderSteps(){ stepsEl.innerHTML=SCENES.map((s,i)=>`${s.grp?`<div class="grpT">${s.grp}</div>`:''}<div class="step ${i===cur?'active':i<cur?'done':''}" data-i="${i}"><div class="no">${i<cur?'✓':i+1}</div><div>${s.title}</div></div>`).join('');
  stepsEl.querySelectorAll('.step').forEach(e=>e.onclick=()=>go(+e.dataset.i)); bar.style.width=((cur+1)/SCENES.length*100)+'%'; }
async function runScene(i){ const tk=++token; cur=i; renderSteps(); const s=SCENES[i]; wt.textContent=s.win; page.innerHTML=`<div class="scene">${s.html}</div>`;
  cap.innerHTML=`<span class="tag">第 ${i+1}/${SCENES.length} 步</span>`; cursor.style.left='60%'; cursor.style.top='75%';
  try { await sleep(500); await waitPlay(tk);
    for(const a of s.acts){
      if(a.s) cap.innerHTML=`<span class="tag">第 ${i+1}/${SCENES.length} 步</span>${a.s}`;
      if(a.w) await sleep(a.w);
      if(a.c) await click(document.querySelector(a.c),tk);
      if(a.f) a.f();
      await waitPlay(tk);
    }
    await sleep(2400); await waitPlay(tk);
    if(i<SCENES.length-1) runScene(i+1); else stepsEl.querySelectorAll('.step').forEach(e=>e.classList.add('done'));
  } catch(e) { /* 被跳转打断 */ } }
function go(i){ paused=false; document.querySelector('#play').textContent='⏸ 暂停'; runScene(Math.max(0,Math.min(SCENES.length-1,i))); }
document.querySelector('#prev').onclick=()=>go(cur-1);
document.querySelector('#next').onclick=()=>go(cur+1);
document.querySelector('#replay').onclick=()=>go(cur);
document.querySelector('#play').onclick=e=>{ paused=!paused; e.target.textContent=paused?'▶ 继续':'⏸ 暂停'; };
runScene(0);
</script>
</body>
</html>
